<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Todo List</title>
  </head>
  <body>
    <header>
      <h1 id="heading">TO-DO</h1>
      <button id="add-btn">ADD TASK</button>
    </header>
    <main>
      <div id="left-container">
        <button id="project-btn">NEW PROJECT</button>
        <div id="project-container"></div>
      </div>
      <div id="right-container">
        <h1 id="tasks-header">YOUR TO DO'S</h1>
        <div id="tasks-container">
          <dialog id="task-display-dialog">
            <h1>Task details</h1>
            <h2>Task title</h2>
            <p>Task description</p>
            <p>Task due date</p>
            <p>priority: low</p>
            <div id="dialogBtns">
              <button>Delete task</button>
              <button>Edit task</button>
            </div>
          </dialog>
        </div>
      </div>
    </main>
  </body>
</html>

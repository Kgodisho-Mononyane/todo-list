<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Todo List</title>
  </head>
  <body>
    <header>
      <h1 id="heading">TO-DO</h1>
      <button id="add-btn">ADD TASK</button>
    </header>
    <main>
      <div id="left-container">
        <button id="project-btn">NEW PROJECT</button>
        <div id="project-container">
          <div class="project" id="default-project">ALL</div>
        </div>
      </div>
      <div id="right-container">
        <h1 id="tasks-header">Right Container Header</h1>
        <div id="tasks-container">
          <div class="todo-container">
            <h2 class="todo-header">Wake up at 5</h2>
            <p class="todo-dueDate">25-10-2026</p>
            <div class="todo-priority">Priority: Low</div>
            <button class="todo-complete-btn">Complete</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

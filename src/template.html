<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Todo List</title>
  </head>
  <body>
    <header>
      <h1 id="heading">TO-DO</h1>
      <button id="add-btn">ADD TASK</button>
    </header>
    <main>
      <div id="left-container">
        <button id="project-btn">NEW PROJECT</button>
        <div id="project-container">
          <button>Default</button>
        </div>
      </div>
      <div id="right-container">
        <h1 id="tasks-header">DEFAULT TASKS</h1>
        <div id="tasks-container">test</div>
        <dialog id="add-dialog" closedby="any">
          <form action="" method="post" id="add-form">
            <h2 id="add-header">ADD NEW TASK</h2>
            <label>Title: <input type="text" /></label>
            <label>Description: <input type="text" /></label>
            <label>Due: <input type="text" /></label>
            <label>Project: <input type="text" /></label>
            <label>Priority: <input type="text" /></label>
            <button id="add-submit-btn" type="submit">SUBMIT</button>
          </form>
        </dialog>
        <dialog id="project-dialog" closedby="any">
          <form action="" method="post" id="project-form">
            <h2 id="project-header">CREATE PROJECT</h2>
            <label>Project Name: <input type="text" /></label>
            <button id="project-submit-btn" type="submit">SUBMIT</button>
          </form>
        </dialog>
      </div>
    </main>
  </body>
</html>
